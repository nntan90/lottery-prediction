# =============================================================================
# scoring.yaml — Expert Borda Scoring Configuration (v3.2 — 5 Models)
# Externalized from ensemble_engine.py for A/B testing without code changes
# =============================================================================
#
# v3.2 Upgrade: 5 models thay vì 3
#   - Model 1 (frequency): Pure frequency/hot-cool
#   - Model 2 (gap_overdue): Pure gap/overdue
#   - Model 3 (markov): Markov Chain transition
#   - Model 4 (xgboost_core): XGBoost ML classifier
#   - Model 5 (lstm): LSTM/GRU sequence model
#
# Trọng số khởi đầu (v3.2.1 — calibrated):
#   Frequency=0.20, Gap=0.20, Markov=0.20, XGBoost=0.25, LSTM=0.15
# Sau 60-90 ngày backtest, cập nhật lại theo hiệu suất thật.
# =============================================================================

# --- Model Weights (Starting Weights) ---
# Higher weight = more influence on final score
# Tổng không cần = 1.0 (sẽ được normalize trong ensemble engine)
weights:
  frequency: 0.20          # Model 1: Pure frequency/hot-cool
  gap_overdue: 0.20        # Model 2: Pure gap/overdue
  markov: 0.20             # Model 3: Markov Chain transition (stable, no training needed)
  xgboost_core: 0.25       # Model 4: XGBoost ML classifier (mature, 17 features)
  lstm: 0.15               # Model 5: LSTM/GRU (on-the-fly quality low — increase after pre-trained model deployed)

# --- DEPRECATED v3.1 weights (kept for reference) ---
# freq_gap: 1.0   ← replaced by frequency + gap_overdue
# markov: 1.0     ← kept, weight adjusted
# xgboost_core: 2.0 ← kept, weight adjusted

# --- Borda Points by Rank (1-indexed) ---
borda_points:
  1: 5
  2: 4
  3: 3
  4: 2
  5: 1
  6: 0.5
  7: 0.4
  8: 0.3
  9: 0.2
  10: 0.1

# --- Consensus Rules ---
# Bonus when multiple models agree on the same pair
# With 5 models × N provinces, consensus thresholds scale dynamically
consensus:
  gold_threshold: 3       # Number of models for Gold consensus
  silver_threshold: 2     # Number of models for Silver consensus
  gold_bonus: 5.0         # Score bonus for Gold consensus
  silver_bonus: 2.0       # Score bonus for Silver consensus

# --- Historical Frequency Rules ---
# Based on 3-week same-weekday lookback
history:
  overdue_penalty: -2.0   # Appeared >= 2 times in last 3 weeks (likely cooling down)
  sweetspot_bonus: 2.0    # Appeared exactly 1 time (riding the rhythm)
  potential_bonus: 1.0    # Never appeared (building pressure, likely due)

# --- CombSUM Normalization ---
# If true, normalize each model's scores to [0,1] before aggregation
# This implements: FinalScore(n) = Σ w_m · s_m(n) where s_m is normalized
combsum:
  enabled: true            # Use CombSUM normalization (recommended for mixed score scales)
  method: "minmax"         # Normalization method: "minmax" or "zscore"

# --- Minimum Model Agreement ---
# Pair must be selected by at least min_models_agree models to be considered
# Set to 1 to disable (any model can nominate)
min_models_agree: 1        # After 60-90 days, consider setting to 2 for robustness

# =============================================================================
# XSMB-Specific Overrides (v3.3 — Diversity & Anti-Cluster)
# =============================================================================
# Reasoning:
#   XSMB chỉ có 5 model results (1 province) vs XSMN 15+ results (3+ provinces).
#   Consensus bonus quá lớn (5.0) so với base score (~1.0) khiến top 3 cluster.
#   Freq+Gap models trùng 10/17 features với XGBoost → triple-counting.
#   Giải pháp: giảm consensus, rebalance weights, Pure Borda, diversity enforcement.
#
# Nếu key không có trong xsmb_overrides, sẽ fallback về giá trị global ở trên.
# =============================================================================
xsmb_overrides:
  # --- XSMB Weights (v3.3 — de-duplicate Freq/Gap overlap with XGBoost) ---
  # Freq+Gap: giảm vì XGBoost đã bao gồm tất cả features của chúng
  # Markov: tăng vì là signal THỰC SỰ independent (transition matrix)
  # XGBoost: tăng vì là superset model với 17 features
  # LSTM: giữ vì là independent deep learning signal
  weights:
    frequency: 0.10         # ↓ from 0.20 (trùng với XGBoost features)
    gap_overdue: 0.10       # ↓ from 0.20 (trùng với XGBoost features)
    markov: 0.25            # ↑ from 0.20 (independent transition matrix)
    xgboost_core: 0.30      # ↑ from 0.25 (superset model)
    lstm: 0.25              # ↑ from 0.15 (independent deep learning)

  # --- XSMB Consensus (v3.3 — reduced to prevent score domination) ---
  # Với chỉ 5 models, consensus ≥2 xảy ra ~2.3 lần do ngẫu nhiên.
  # Bonus phải nhỏ hơn base score (~1.0) để không dominate ranking.
  consensus:
    gold_threshold: 4       # ↑ from 3 (khó đạt hơn với 5 models)
    silver_threshold: 3     # ↑ from 2 (tránh random coincidence)
    gold_bonus: 1.5         # ↓ from 5.0 (không vượt base score max)
    silver_bonus: 0.5       # ↓ from 2.0

  # --- XSMB History (v3.3 — reduced gambler's fallacy bias) ---
  # Lottery draws are independent events. History adjustment nên nhỏ.
  history:
    overdue_penalty: -0.5   # ↓ from -2.0
    sweetspot_bonus: 0.5    # ↓ from 2.0
    potential_bonus: 0.3    # ↓ from 1.0

  # --- XSMB CombSUM (v3.3 — switch to Pure Borda) ---
  # CombSUM min-max normalize triệt tiêu rank 4-5 (score ≈ 0).
  # Pure Borda preserves rank information: rank 5 vẫn đóng góp 1 điểm.
  combsum:
    enabled: false          # ← Pure Borda mode cho XSMB

  # --- XSMB Diversity Enforcement (v3.3 — MMR selection) ---
  # Sau khi tính score, dùng MMR (Maximal Marginal Relevance) để chọn top 3
  # sao cho các picks không cluster (không cùng derive từ 1 set models).
  # lambda: 0 = max diversity, 1 = max relevance (pure score-based)
  diversity:
    enabled: true
    lambda: 0.6             # Balance giữa score cao và diversity

# =============================================================================
# XSMB v4.2 — Dedicated Multi-Model Ensemble (10 Models)
# =============================================================================
# Replaces xsmb_overrides for the v4 pipeline (src/xsmb_ensemble/).
# 10 models: 7 existing models + 3 statistical test models
# =============================================================================
xsmb_v4:
  models:
    - frequency
    - gap_overdue
    - markov
    - xgboost_core
    - lstm
    - bayesian
    - cyclic
    - stats_freq_gap
    - chisquare_gof
    - chisquare_independence

  # --- v4.2 Weights (10 models, sum ≈ 1.0) ---
  # Freq+Gap: low weight (overlap with XGBoost features)
  # Markov²: medium (independent second-order transition)
  # XGBoost: highest (25-feature superset ML model)
  # BiLSTM: medium-high (independent deep learning)
  # Bayesian: medium (uncertainty-aware, independent signal)
  # Cyclic: medium (FFT-based, fully independent signal)
  weights:
    frequency: 0.10
    gap_overdue: 0.10
    markov: 0.13
    xgboost_core: 0.17
    lstm: 0.12
    bayesian: 0.12
    cyclic: 0.10
    stats_freq_gap: 0.09
    chisquare_gof: 0.08
    chisquare_independence: 0.09

  # --- Consensus (v4.1 — with scaling cap) ---
  # Cap: bonus KHÔNG vượt quá base score → tránh consensus domination
  consensus:
    gold_threshold: 6       # 6/10 models agree
    silver_threshold: 4     # 4/10 models agree
    gold_bonus: 1.5
    silver_bonus: 0.5
    cap_to_base: true       # v4.1: cap bonus ≤ |base_score|

  # --- History (v4.1 — exponential penalty) ---
  # Penalty scales exponentially: -0.5 × 2^(count-2)
  # count=3 → -2.0, count=4 → -4.0, count=5 → -8.0
  history:
    overdue_penalty: -0.5
    exponential: true       # v4.1: exponential scaling
    sweetspot_bonus: 0.5
    potential_bonus: 0.3

  # --- Recency Dampener (v4.1 — Anti-Echo) ---
  # Sau khi tính ensemble score, multiply decay factor cho pair nổ nhiều.
  # decay = decay_base ^ (count - 1)
  # count=2 → ×0.7, count=3 → ×0.49, count=4 → ×0.343
  recency_dampener:
    enabled: true
    threshold: 2            # Apply khi recent_count >= threshold
    decay_base: 0.7         # Decay factor per extra hit

  # --- Diversity (MMR selection) ---
  diversity:
    enabled: true
    lambda: 0.75

  # --- Auto-Weight Tuning ---
  # Automatically adjust weights based on backtest performance
  auto_weight:
    enabled: true
    lookback_days: 30       # Analyse 30-day rolling window
    smoothing: 0.7          # 70% performance-driven, 30% current weight
    min_weight: 0.05        # No model below 5%
    max_weight: 0.35        # No model above 35%

# =============================================================================
# XSMB v5.0 — Precision Ensemble Scoring (Replaces v4.2)
# =============================================================================
# Key changes from v4.2:
#   - Proportional raw score fusion (replaces Borda rank-based)
#   - Continuous consensus multiplier (replaces additive threshold bonus)
#   - Single-pass history guard (replaces double penalty)
#   - No MMR diversity (clean scoring = natural diversity)
# =============================================================================
xsmb_v5:
  # --- Weights (v5.1+Loto)
  # Current production uses: frequency, markov, chisquare_gof, cdm, loto_statistical.
  # Other weights are retained for disabled models so they can be re-enabled safely.
  weights:
    frequency: 0.05             # ↓↓ overlap with XGBoost features
    gap_overdue: 0.05           # ↓↓ overlap with XGBoost features
    markov: 0.10                # ↓ independent but overlaps in pattern logic
    xgboost_core: 0.20          # ↑↑ ML superset model (high reliability)
    lstm: 0.16                  # ↑↑ deep learning sequence
    bayesian: 0.12              # high hit rate observed
    cyclic: 0.10                # high hit rate observed
    stats_freq_gap: 0.04        # ↓ redundant with freq/gap
    chisquare_gof: 0.04         # ↓ lower predictive value
    chisquare_independence: 0.04 # ↓ lower predictive value
    cdm: 0.05                   # ↓ Dirichlet-Multinomial baseline
    loto_statistical: 0.05      # statistical loto analyzer consensus signal

  # --- Consensus Amplifier (v5.0 — continuous multiplicative) ---
  # multiplier = 1 + alpha × (vote_count - 1), capped at max_multiplier
  # vote=1: ×1.0, vote=2: ×1.1, vote=3: ×1.2, vote=4: ×1.3, vote=5+: ×1.4
  consensus:
    alpha: 0.10                 # ↓ Each additional vote adds only 10% boost (reduced False Consensus Trap)
    max_multiplier: 1.40        # ↓ Cap to prevent explosion

  # --- History Guard (v5.0 — single multiplicative modifier) ---
  # One modifier applied once. No double penalty.
  # count_5 = appearances in 5 same-weekday draws
  # count_10 = appearances in 10 same-weekday draws
  history_modifier:
    hot_4_plus: 0.00            # count_5 >= 4 → EXCLUDE (pattern break)
    hot_3: 0.40                 # count_5 == 3 → strong reduction
    warm_2: 0.70                # count_5 == 2 → moderate reduction
    neutral_1: 1.00             # count_5 == 1 → neutral
    cold_pressure: 1.15         # count_5 == 0, count_10 >= 2 → pressure building
    cold_mild: 1.05             # count_5 == 0, count_10 == 1 → mild pressure
    toxic_cold: 0.60            # count_5 == 0, count_10 == 0 → too cold

  history_lookback_same_weekday: 5   # Recent history window
  history_extended_lookback: 10       # Extended history for toxic gap check

  # --- Auto-Weight Tuning (inherited from v4.2) ---
  auto_weight:
    enabled: true
    lookback_days: 30
    smoothing: 0.7
    min_weight: 0.05
    max_weight: 0.35

# =============================================================================
# XSMN-Specific Overrides (v3.3 — Rebalanced Scoring)
# =============================================================================
xsmn_overrides:
  weights:
    frequency: 0.15             # ↑ tăng
    gap_overdue: 0.15           # ↑ tăng
    markov: 0.20                # ↑ tăng
    xgboost_core: 0.20          # ↓ giảm vì model bị cũ
    lstm: 0.15                  # ↓ giảm
    cdm: 0.15                   # ↑ tăng

  consensus:
    gold_threshold: 4
    silver_threshold: 3
    gold_bonus: 1.5             # ↑ tăng (tương đương XSMB)
    silver_bonus: 0.5           # ↑ tăng

  history:
    overdue_penalty: -0.5
    sweetspot_bonus: 0.5
    potential_bonus: 0.3

  combsum:
    enabled: true            # ✅ Bật lại CombSUM để giữ thông tin độ tự tin

  diversity:
    enabled: true            # ✅ Bật Diversity
    lambda: 0.6

# =============================================================================
# Model Credibility Scoring System
# =============================================================================
# Pre-prediction engine that evaluates each sub-model's trustworthiness
# across 6 dimensions before ensemble aggregation.
# Replaces auto_weight.py for dynamic weight tuning.
# =============================================================================
credibility:
  enabled: true
  lookback_xsmb: 30          # Number of past draws to evaluate (XSMB daily)
  lookback_xsmn: 8           # Number of past draws to evaluate (XSMN weekly)
  recency_decay: 0.85        # Exponential decay per draw (15% loss/draw)
  smoothing: 0.60            # 60% credibility, 40% config weight
  min_weight: 0.05           # Floor per model
  max_weight: 0.35           # Ceiling per model
  confidence_floor: 0.4      # Minimum Borda confidence multiplier
  confidence_ceil: 1.2       # Maximum Borda confidence multiplier
  dim_weights:
    recency_mrr: 0.30        # Recent hit quality (decay-weighted)
    streak_momentum: 0.25    # Hot/cold consecutive patterns
    ndcg_score: 0.15         # Ranking quality (DCG-based)
    consensus_accuracy: 0.10 # Model's consensus hit accuracy
    stability_index: 0.10    # Output consistency
    recovery_speed: 0.10     # Bounce-back speed after misses
