name: 04 - Evaluate Retrain Models

# Chạy mỗi ngày lúc 22:37 VN (15:37 UTC), sau khi verify prediction đã xong.
# Agent đọc prediction_results đã verify mới nhất và đánh giá cả single + multi model.
on:
  schedule:
    - cron: '37 15 * * *'  # 22:37 GMT+7 (15:37 UTC)
  workflow_dispatch:  # Cho phép trigger thủ công
    inputs:
      target_date:
        description: 'Verified prediction date to evaluate (YYYY-MM-DD). Empty = latest verified'
        required: false
        default: ''
      dry_run:
        description: 'Only evaluate decisions, do not retrain'
        required: false
        default: 'false'

jobs:
  evaluate-retrain:
    name: Evaluate Retrain Decisions (Single + Multi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluate retrain decisions
        id: evaluate
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE:         ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
          DRY_RUN:             ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi

          DRY_ARG=()
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_ARG=(--dry-run)
          fi

          python src/agent/master_retrain_agent.py "${DATE_ARG[@]}" "${DRY_ARG[@]}"

      - name: "🚨 Notify Telegram - 04 Evaluate Retrain Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>04 - Evaluate Retrain FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
