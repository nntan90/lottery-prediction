name: 09 - Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/09-regression-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression-tests:
    name: Run Regression Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml 2>&1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: "🚨 Notify Telegram - Tests Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT="${{ github.sha }}"
          SHORT_SHA="${COMMIT:0:7}"
          MSG="🚨 <b>REGRESSION TESTS FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="📝 Commit: <code>${SHORT_SHA}</code>%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Test Results</a>%0A"
          MSG+="⚠️ Chạy <code>python3 -m pytest tests/ -v</code> locally để debug."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
