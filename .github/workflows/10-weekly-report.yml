name: 10 - Weekly System Report

on:
  # Sáng Thứ 2 hàng tuần lúc 6:00 VNT = 23:00 UTC (Chủ Nhật)
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:
    inputs:
      week_end:
        description: 'Ngày CN kết thúc tuần (YYYY-MM-DD). Mặc định = CN gần nhất'
        required: false
        type: string

jobs:
  weekly-report:
    name: Generate Weekly System Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Weekly Report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_GEN_MODE: ${{ vars.LLM_GEN_MODE }}
          PYTHONPATH: .
        run: |
          if [ -n "${{ inputs.week_end }}" ]; then
            python src/scripts/weekly_report.py --week-end "${{ inputs.week_end }}"
          else
            python src/scripts/weekly_report.py
          fi

      - name: Upload XML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: reports/*.xml
          retention-days: 90

      - name: "🚨 Notify Telegram - Report Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>10 - Weekly Report FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
