name: 01 - Daily Lottery Crawl

# Chạy hàng ngày lúc 21:30 GMT+7 (14:30 UTC), sau khi kết quả xổ số đã có.
on:
  schedule:
    - cron: '30 14 * * *'  # 21:30 GMT+7 (14:30 UTC)
  workflow_dispatch:  # Cho phép chạy thủ công
    inputs:
      target_date:
        description: 'Operational date to crawl/build (YYYY-MM-DD). Empty = auto'
        required: false
        default: ''

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Crawl XSMB (Miền Bắc) - độc lập
  # ─────────────────────────────────────────────
  crawl-xsmb:
    name: Crawl XSMB (Miền Bắc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl XSMB Results
        id: crawl_xsmb
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/crawl_xsmb.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - XSMB Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>XSMB Crawl FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Job bị lỗi hoặc bị terminate. Kiểm tra GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 2: Crawl XSMN (Miền Nam) - độc lập
  # ─────────────────────────────────────────────
  crawl-xsmn:
    name: Crawl XSMN (Miền Nam)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl XSMN Results
        id: crawl_xsmn
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/crawl_xsmn.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - XSMN Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>XSMN Crawl FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Job bị lỗi hoặc bị terminate. Kiểm tra GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 3: Build V3 Data (tails_2d + pair_features)
  # Chạy sau khi cả 2 crawl jobs xong
  # ─────────────────────────────────────────────
  build-data:
    name: Build Tails & Features (V3)
    runs-on: ubuntu-latest
    needs: [crawl-xsmb, crawl-xsmn]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build tails_2d from lottery_draws
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/build_tails.py "${DATE_ARG[@]}"

      - name: Build pair_features from tails_2d
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/build_features.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - Build Data Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>01 - Build Tails/Features FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
