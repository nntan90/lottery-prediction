name: 01 - Daily Lottery Crawl

# Chạy hàng ngày lúc 18:16 GMT+7 (11:16 UTC), sau khi kết quả xổ số đã có.
# GitHub scheduled workflows can be delayed/missed, so keep fallback slots.
# A preflight guard skips duplicate fallback runs once crawl + verify are done.
on:
  schedule:
    - cron: '16 11 * * *'  # 18:16 GMT+7 (11:16 UTC)
    - cron: '16 13 * * *'  # 20:16 GMT+7 fallback
    - cron: '16 15 * * *'  # 22:16 GMT+7 fallback
    - cron: '16 17 * * *'  # 00:16 GMT+7 fallback, operational date = yesterday
    - cron: '16 19 * * *'  # 02:16 GMT+7 fallback, operational date = yesterday
    - cron: '16 21 * * *'  # 04:16 GMT+7 fallback, operational date = yesterday
  workflow_dispatch:  # Cho phép chạy thủ công
    inputs:
      target_date:
        description: 'Operational date to crawl/build (YYYY-MM-DD). Empty = auto'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Job 0: Preflight guard for fallback schedules
  # ─────────────────────────────────────────────
  preflight:
    name: Preflight Daily Crawl
    runs-on: ubuntu-latest
    outputs:
      target_date: ${{ steps.guard.outputs.target_date }}
      should_run: ${{ steps.guard.outputs.should_run }}
      reason: ${{ steps.guard.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install preflight dependencies
        run: |
          pip install --upgrade pip
          pip install supabase==2.10.0 python-dotenv==1.0.1

      - name: Check whether daily crawl already completed
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: .
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python src/scripts/should_run_daily_crawl.py

  # ─────────────────────────────────────────────
  # Job 1: Crawl XSMB (Miền Bắc) - độc lập
  # ─────────────────────────────────────────────
  crawl-xsmb:
    name: Crawl XSMB (Miền Bắc)
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl XSMB Results
        id: crawl_xsmb
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/crawl_xsmb.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - XSMB Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>XSMB Crawl FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Job bị lỗi hoặc bị terminate. Kiểm tra GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 2: Crawl XSMN (Miền Nam) - độc lập
  # ─────────────────────────────────────────────
  crawl-xsmn:
    name: Crawl XSMN (Miền Nam)
    runs-on: ubuntu-latest
    needs: preflight
    if: ${{ needs.preflight.outputs.should_run == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl XSMN Results
        id: crawl_xsmn
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/crawl_xsmn.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - XSMN Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>XSMN Crawl FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Job bị lỗi hoặc bị terminate. Kiểm tra GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 3: Build V3 Data (tails_2d + pair_features)
  # Chạy sau khi cả 2 crawl jobs xong
  # ─────────────────────────────────────────────
  build-data:
    name: Build Tails & Features (V3)
    runs-on: ubuntu-latest
    needs: [preflight, crawl-xsmb, crawl-xsmn]
    if: ${{ needs.preflight.outputs.should_run == 'true' && needs.crawl-xsmb.result == 'success' && needs.crawl-xsmn.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build tails_2d from lottery_draws
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/build_tails.py "${DATE_ARG[@]}"

      - name: Build pair_features from tails_2d
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/build_features.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - Build Data Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>01 - Build Tails/Features FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 4: Verify predictions after crawl/build success
  # Keeps workflow_dispatch target_date aligned for manual backfills.
  # ─────────────────────────────────────────────
  verify-predictions:
    name: Verify Predictions vs Results
    runs-on: ubuntu-latest
    needs: [preflight, build-data]
    if: ${{ needs.preflight.outputs.should_run == 'true' && needs.build-data.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Predictions vs Results
        id: verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/scripts/verify_v3.py "${DATE_ARG[@]}"

      - name: "🚨 Notify Telegram - 01 Verify Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>01 - Verify Predictions FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Bước kiểm tra dự đoán sau crawl bị lỗi hoặc terminate."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

  # ─────────────────────────────────────────────
  # Job 5: Update all six XSMN provincial families
  # Main path; the 23:00 workflow remains an idempotent recovery.
  # ─────────────────────────────────────────────
  refresh-xsmn-models:
    name: Refresh XSMN Provincial Models (6 Families)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: xsmn-provincial-model-refresh
      cancel-in-progress: false
    needs: [preflight, verify-predictions]
    if: ${{ needs.preflight.outputs.should_run == 'true' && needs.verify-predictions.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Retrain ML and refresh rule families
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
          TARGET_DATE: ${{ needs.preflight.outputs.target_date }}
        run: |
          DATE_ARG=()
          if [ -n "${TARGET_DATE}" ]; then
            DATE_ARG=(--date "${TARGET_DATE}")
          fi
          python src/agent/master_retrain_agent.py "${DATE_ARG[@]}"
