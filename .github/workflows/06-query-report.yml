name: 06 - Query Profit Report

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Từ ngày (DD-MM-YYYY)'
        required: true
        type: string
        default: '01-02-2026'
      to_date:
        description: 'Đến ngày (DD-MM-YYYY)'
        required: true
        type: string
        default: '28-02-2026'

jobs:
  query-report:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Profit Report Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PYTHONPATH: .
      run: |
        python src/scripts/report_profit.py --from-date "${{ inputs.from_date }}" --to-date "${{ inputs.to_date }}"

    - name: Upload CSV Report
      uses: actions/upload-artifact@v4
      with:
        name: profit-report-${{ inputs.from_date }}-to-${{ inputs.to_date }}
        path: profit_report_*.csv

    - name: "🚨 Notify Telegram - Report Failed"
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        MSG="🚨 <b>06 - Query Report FAILED</b>%0A"
        MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
        MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=${MSG}" \
          -d "parse_mode=HTML" \
          -d "disable_web_page_preview=true"
