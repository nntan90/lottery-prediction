name: 02 - Daily Ensemble Prediction

# Chạy hàng ngày lúc 7:14 GMT+7 (00:14 UTC)
# TARGET_PROVINCES được tự động phân giải qua env var dựa trên DOW hiện tại
on:
  schedule:
    - cron: '14 0 * * *'  # 7:14 GMT+7 (00:14 UTC) hằng ngày
  workflow_dispatch:         # Cho phép chạy thủ công

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict-ensemble:
    name: Multi-Model Ensemble Prediction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Install PyTorch CPU-only (v3.2 LSTM model) — lighter than full CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Ensemble Prediction
        id: predict
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_GEN_MODE:        ${{ vars.LLM_GEN_MODE }}
          LLM_GEN_PROVIDER:    ${{ vars.LLM_GEN_PROVIDER }}
          # AgentRouter is code-fixed to co.agentrouter.org, GPT-5.5 and Chat Completions.
          LLM_GEN_OPENAI_BACKEND: ${{ vars.LLM_GEN_OPENAI_BACKEND }}
          OPENAI_API_KEY: >-
            ${{ vars.LLM_GEN_MODE == 'shadow' && vars.LLM_GEN_PROVIDER == 'openai' &&
                (vars.LLM_GEN_OPENAI_BACKEND == '' || vars.LLM_GEN_OPENAI_BACKEND == 'official') &&
                secrets.OPENAI_API_KEY || '' }}
          AGENTROUTER_API_KEY: >-
            ${{ vars.LLM_GEN_MODE == 'shadow' && vars.LLM_GEN_PROVIDER == 'openai' &&
                vars.LLM_GEN_OPENAI_BACKEND == 'agentrouter' && secrets.AGENTROUTER_API_KEY || '' }}
          ANTHROPIC_API_KEY: >-
            ${{ vars.LLM_GEN_MODE == 'shadow' && vars.LLM_GEN_PROVIDER == 'anthropic' &&
                secrets.ANTHROPIC_API_KEY || '' }}
          PYTHONPATH: .
          XSMB_COMBO_SELECTOR_MODE: shadow
          # TARGET_PROVINCES: Auto-resolved by resolve_provinces.py based on DOW
        run: |
          python src/scripts/predict_ensemble.py

      # Gửi Telegram nếu workflow fail
      - name: "🚨 Notify Telegram - Ensemble Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>02 - Ensemble Prediction FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Pipeline ensemble bị lỗi. Kiểm tra GitHub Actions."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
