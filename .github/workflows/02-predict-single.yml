name: 02 - Generate Single Model Predictions

# Chạy trước ensemble để gửi preview XGBoost single model.
# 23:45 UTC hôm trước = 06:45 GMT+7 trong ngày dự đoán.
on:
  schedule:
    - cron: '45 23 * * *'  # 06:45 GMT+7 hằng ngày
  workflow_dispatch:

jobs:
  predict-single:
    name: Generate Single Model Prediction (XGBoost V3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Single Model Predictions
        id: predict
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          python src/scripts/predict_single_model.py

      - name: "🚨 Notify Telegram - Single Predict Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>02 - Single Model Prediction FAILED</b>%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>%0A"
          MSG+="⚠️ Single XGBoost prediction job bị lỗi hoặc terminate."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
