name: 06 - Train LSTM Model

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region (XSMB hoặc XSMN)'
        required: true
        default: 'XSMB'
      province:
        description: 'Province slug (all cho XSMB, hoặc tp-hcm, ...)'
        required: true
        default: 'all'
      version:
        description: 'Model version (tự động nếu để trống)'
        required: false
        default: ''
      n_draws:
        description: 'Số kỳ quay dùng để train'
        required: false
        default: '250'
      seq_len:
        description: 'Sequence length (để trống = auto theo region)'
        required: false
        default: ''
      epochs:
        description: 'Số epochs'
        required: false
        default: '40'

jobs:
  train-lstm:
    name: Train LSTM for ${{ inputs.region }}/${{ inputs.province }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: xsmn-provincial-model-refresh
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Train LSTM Model
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: |
          PROVINCE="${{ inputs.province }}"
          VERSION="${{ inputs.version }}"
          N_DRAWS="${{ inputs.n_draws }}"
          SEQ_LEN="${{ inputs.seq_len }}"
          EPOCHS="${{ inputs.epochs }}"

          CMD="python src/scripts/train_lstm.py --region ${{ inputs.region }} --province ${PROVINCE} --n_draws ${N_DRAWS} --epochs ${EPOCHS}"
          if [ -n "${VERSION}" ]; then
            CMD="${CMD} --version ${VERSION}"
          fi
          if [ -n "${SEQ_LEN}" ]; then
            CMD="${CMD} --seq_len ${SEQ_LEN}"
          fi

          echo "Running: ${CMD}"
          ${CMD}

      - name: "🚨 Notify Telegram - 06 LSTM Training Failed"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="🚨 <b>06 - LSTM Training FAILED</b>%0A"
          MSG+="🎯 ${{ inputs.region }}/${{ inputs.province }}%0A"
          MSG+="📅 $(date -u '+%Y-%m-%d %H:%M UTC')%0A"
          MSG+="🔗 <a href='${RUN_URL}'>View Logs</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
